var scoreSum = Number(localStorage.getItem('scoreSum') || '0');
var scoreN = Number(localStorage.getItem('scoreN') || '0');

function save(){localStorage.setItem('day',day);localStorage.setItem('review',JSON.stringify(review));localStorage.setItem('fav',JSON.stringify(fav));localStorage.setItem('done',JSON.stringify(done));localStorage.setItem('streak',streak);localStorage.setItem('scoreSum',scoreSum);localStorage.setItem('scoreN',scoreN);}
function cur(){return DAYS[Math.max(0,Math.min(179,day-1))];}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function jsStr(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');}
function speak(t,rate){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate||0.86;speechSynthesis.speak(u);}
function stopSpeak(){speechSynthesis.cancel();}
function toggleReview(w){var i=review.indexOf(w);if(i>=0)review.splice(i,1);else review.push(w);save();render();}
function toggleFav(w){var i=fav.indexOf(w);if(i>=0)fav.splice(i,1);else fav.push(w);save();render();}
function setView(v,btn){view=v;document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active')});btn.classList.add('active');render();}
function selectDayHtml(){var h='<select onchange="day=Number(this.value);save();render()">';DAYS.forEach(function(x){h+='<option value="'+x.day+'" '+(x.day===day?'selected':'')+'>Day '+x.day+'</option>';});return h+'</select>';}
function topHtml(title,desc,hero){var x=cur();var pct=Math.round(day/180*100);return '<section class="card '+(hero?'hero':'')+'"><div class="top"><div><span class="pill">'+x.phase+'</span><h2>'+title+'</h2><p class="muted">'+desc+'</p></div><div>'+selectDayHtml()+'</div></div><div class="progress"><div class="bar" style="width:'+pct+'%"></div></div><p class="mini">Day '+day+' / 180 · '+x.goal+'</p></section>';}
function vocabCards(items){var h='<div class="grid">';items.forEach(function(v){h+='<div class="item"><div class="word">'+escapeHtml(v.word)+'</div><button onclick="speak(\''+jsStr(v.word)+'\')">🔊 word</button><div class="cn">'+escapeHtml(v.cn)+'</div><div class="example">'+escapeHtml(v.example)+'</div><div class="actions"><button class="warn" onclick="toggleReview(\''+jsStr(v.word)+'\')">'+(review.indexOf(v.word)>=0?'移出复习':'不会，复习')+'</button><button onclick="toggleFav(\''+jsStr(v.word)+'\')">'+(fav.indexOf(v.word)>=0?'★ 已收藏':'☆ 收藏')+'</button><button onclick="speak(\''+jsStr(v.example)+'\',0.72)">慢速例句</button></div></div>';});return h+'</div>';}
function sentenceList(list){var h='';list.forEach(function(s){h+='<div class="sentence">'+escapeHtml(s)+'<div class="actions"><button onclick="speak(\''+jsStr(s)+'\')">🔊</button><button onclick="speak(\''+jsStr(s)+'\',0.72)">慢速</button><button onclick="toggleFav(\''+jsStr(s)+'\')">'+(fav.indexOf(s)>=0?'★ 已收藏':'☆ 收藏')+'</button></div></div>';});return h;}
function renderToday(){var x=cur();document.getElementById('main').innerHTML=topHtml('Today','今天30分钟：Drive Mode 10分钟，Presentation 10分钟，Boss Talk 5分钟，Vocabulary 5分钟。',true)+'<section class="card"><h3>🎧 Drive Mode</h3><div class="drive"><div class="bigicon">🚗</div><p class="muted">开车/通勤播放，不需要看屏幕。</p><button class="driveBtn" onclick="speak(\''+jsStr(x.audio)+'\',0.86)">Normal</button><button class="driveBtn" onclick="speak(\''+jsStr(x.audio)+'\',0.72)">Slow</button><button onclick="stopSpeak()">Stop</button></div></section><section class="card"><h3>🎤 Presentation Gym</h3><div class="sentence"><b>'+escapeHtml(x.weekly.q)+'</b><textarea placeholder="先自己写/说一句，再看参考答案。"></textarea><div class="actions"><button onclick="document.getElementById(\'ans\').classList.toggle(\'hidden\')">Show Answer</button><button onclick="speak(\''+jsStr(x.weekly.a)+'\')">🔊 Answer</button></div><div id="ans" class="answerBox hidden">'+escapeHtml(x.weekly.a)+'</div></div></section><section class="card"><h3>☕ Boss Talk</h3><div class="sentence"><b>'+escapeHtml(x.boss.scene)+'</b><br>'+escapeHtml(x.boss.q)+'<br><span class="mini">'+escapeHtml(x.boss.a)+'</span><div class="actions"><button onclick="speak(\''+jsStr(x.boss.q+' '+x.boss.a)+'\')">🔊</button></div></div></section><section class="card"><h3>📚 Vocabulary</h3>'+vocabCards(x.vocab)+'</section><section class="card"><button class="primary" onclick="finishDay()">完成今天，进入下一天</button></section>';}
function renderDrive(){var x=cur();document.getElementById('main').innerHTML=topHtml('Drive Mode','通勤听力模式：Normal / Slow / Shadowing。',false)+'<section class="card"><div class="drive"><div class="bigicon">🚗🎧</div><h3>Day '+x.day+' Audio</h3><button class="driveBtn" onclick="speak(\''+jsStr(x.audio)+'\',0.86)">Normal</button><button class="driveBtn" onclick="speak(\''+jsStr(x.audio)+'\',0.72)">Slow</button><button class="driveBtn" onclick="speak(\''+jsStr(x.audio)+'\',0.62)">Shadowing</button><button onclick="stopSpeak()">Stop</button></div></section><section class="card"><h3>Script</h3><div class="sentence">'+escapeHtml(x.audio)+'</div></section>';}
function renderGym(){var x=cur();document.getElementById('main').innerHTML=topHtml('Presentation Gym','Weekly Update 训练：先自己答，再看自然表达。',false)+'<section class="card"><h3>'+escapeHtml(x.weekly.q)+'</h3><textarea placeholder="Write your answer here..."></textarea><div class="actions"><button onclick="document.getElementById(\'gans\').classList.toggle(\'hidden\')">Show Example</button><button onclick="speak(\''+jsStr(x.weekly.a)+'\')">🔊</button></div><div id="gans" class="answerBox hidden">'+escapeHtml(x.weekly.a)+'</div></section><section class="card"><h3>Presentation Sentence</h3>'+sentenceList([x.presentation])+'</section>';}
function renderBoss(){var h=topHtml('Boss Talk','老板Small Talk问题库。',false)+'<section class="card"><h3>Today</h3>';var x=cur();h+='<div class="sentence"><b>'+escapeHtml(x.boss.scene)+'</b><br>'+escapeHtml(x.boss.q)+'<br><span class="mini">'+escapeHtml(x.boss.a)+'</span><div class="actions"><button onclick="speak(\''+jsStr(x.boss.q+' '+x.boss.a)+'\')">🔊</button></div></div></section><section class="card"><h3>Library</h3>';for(var i=0;i<100;i++){var q=DATA.boss[i%DATA.boss.length];h+='<div class="sentence"><b>'+(i+1)+'. '+escapeHtml(q.scene)+'</b><br>'+escapeHtml(q.q)+'<br><span class="mini">'+escapeHtml(q.a)+'</span><div class="actions"><button onclick="speak(\''+jsStr(q.q+' '+q.a)+'\')">🔊</button></div></div>';}h+='</section>';document.getElementById('main').innerHTML=h;}
function renderListen(){var x=cur();document.getElementById('main').innerHTML=topHtml('Listening Challenge','听一句真实工作英语，输入你听到的内容。',false)+'<section class="card"><button class="primary" onclick="speak(\''+jsStr(x.listening)+'\')">▶ Play</button> <button onclick="speak(\''+jsStr(x.listening)+'\',0.72)">Slow</button><textarea id="dict" placeholder="Type what you heard..."></textarea><div class="actions"><button onclick="checkListen()">Check</button></div><div id="result" class="answerBox"></div></section>';}
function checkListen(){var x=cur();var a=document.getElementById('dict').value.toLowerCase().replace(/[^a-z ]/g,'').split(/\s+/);var b=x.listening.toLowerCase().replace(/[^a-z ]/g,'').split(/\s+/);var hit=0;b.forEach(function(w){if(a.indexOf(w)>=0)hit++;});var sc=Math.round(hit/b.length*100);scoreSum+=sc;scoreN++;save();document.getElementById('result').innerHTML='<b>Score: '+sc+'%</b><br>Answer: '+escapeHtml(x.listening);renderStats();}
function renderVocab(){var all=[];DAYS.forEach(function(x){all=all.concat(x.vocab)});document.getElementById('main').innerHTML=topHtml('Vocabulary','180天工作英语核心词库。',false)+'<section class="card"><input class="searchbar" id="search" placeholder="Search..." oninput="filterVocab()"><div id="voc">'+vocabCards(all)+'</div></section>';}
function filterVocab(){var kw=document.getElementById('search').value.toLowerCase();var all=[];DAYS.forEach(function(x){x.vocab.forEach(function(v){if(v.word.toLowerCase().includes(kw)||v.cn.includes(kw)||v.example.toLowerCase().includes(kw))all.push(v);})});document.getElementById('voc').innerHTML=vocabCards(all);}
function renderAcademy(){var h=topHtml('Strategy Academy','把 Strategy One 逻辑变成英文。',false)+'<section class="card"><div class="grid">';DATA.academy.forEach(function(a){h+='<div class="item"><div class="word">'+escapeHtml(a.topic)+'</div><div class="cn">'+escapeHtml(a.cn)+'</div><div class="example">'+escapeHtml(a.explain)+'</div><div class="actions"><button onclick="speak(\''+jsStr(a.explain)+'\')">🔊</button></div></div>';});h+='</div></section>';document.getElementById('main').innerHTML=h;}
function renderReview(){var all=[];DAYS.forEach(function(x){x.vocab.forEach(function(v){if(review.indexOf(v.word)>=0)all.push(v);})});document.getElementById('main').innerHTML=topHtml('Review','复习你标记不会的词。',false)+'<section class="card">'+(all.length?vocabCards(all):'<div class="empty">暂无复习内容。</div>')+'</section>';}
function renderFav(){var all=[];DAYS.forEach(function(x){x.vocab.forEach(function(v){if(fav.indexOf(v.word)>=0)all.push(v);})});document.getElementById('main').innerHTML=topHtml('Favorites','开会前快速复习收藏内容。',false)+'<section class="card">'+(all.length?vocabCards(all):'<div class="empty">暂无收藏内容。</div>')+'</section>';}
function renderDashboard(){var avg=scoreN?Math.round(scoreSum/scoreN):0;var comp=Math.round(done.length/180*100);document.getElementById('main').innerHTML=topHtml('Dashboard','学习进度和听力分数。',false)+'<section class="card"><div class="dashboard"><div class="metric"><b>'+done.length+'</b><br>Completed<div class="levelbar"><span style="width:'+comp+'%"></span></div></div><div class="metric"><b>'+streak+'</b><br>Streak<div class="levelbar"><span style="width:'+Math.min(streak,30)/30*100+'%"></span></div></div><div class="metric"><b>'+avg+'%</b><br>Listening<div class="levelbar"><span style="width:'+avg+'%"></span></div></div><div class="metric"><b>'+fav.length+'</b><br>Favorites<div class="levelbar"><span style="width:'+Math.min(fav.length,50)/50*100+'%"></span></div></div></div></section>';}
function finishDay(){if(done.indexOf(day)<0)done.push(day);streak++;if(day<180)day++;save();render();}
function renderStats(){document.getElementById('stats').innerHTML='<b>Progress</b><br>Day: '+day+' / 180<br>Completed: '+done.length+'<br>Streak: 🔥 '+streak+'<br>Review: '+review.length+'<br>Favorites: '+fav.length;}
function render(){try{if(view==='today')renderToday();if(view==='drive')renderDrive();if(view==='gym')renderGym();if(view==='boss')renderBoss();if(view==='listen')renderListen();if(view==='vocab')renderVocab();if(view==='academy')renderAcademy();if(view==='review')renderReview();if(view==='fav')renderFav();if(view==='dashboard')renderDashboard();renderStats();}catch(e){document.getElementById('main').innerHTML='<section class="card"><h2>Error</h2><p>'+escapeHtml(e.message)+'</p></section>';console.error(e);}}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('service-worker.js');});}
render();
</script>
</body>
</html>
