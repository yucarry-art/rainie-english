<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rainie's Retail English Coach V3.1</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f4f43" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root {
      --bg:#f6f4ef; --card:#fff; --ink:#1f2933; --muted:#6b7280; --line:#e6dfd2;
      --green:#0f4f43; --green2:#e6f2ee; --orange:#b45309; --yellow:#fff7df;
      --dark:#10231e; --shadow:0 14px 36px rgba(31,41,51,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif}
    header{max-width:1200px;margin:auto;padding:22px 16px 10px}
    h1{margin:0;font-size:28px;letter-spacing:-.6px}
    .sub{color:var(--muted);line-height:1.6;margin-top:8px}
    .app{max-width:1200px;margin:auto;padding:0 16px 36px;display:grid;grid-template-columns:250px 1fr;gap:18px}
    aside,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
    aside{padding:14px;height:fit-content;position:sticky;top:14px}
    .tab{width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:13px;font-size:15px;cursor:pointer;margin-bottom:6px;color:var(--ink)}
    .tab.active{background:var(--green2);color:var(--green);font-weight:900}
    .stats{margin-top:12px;padding:13px;background:#faf9f6;border-radius:14px;color:var(--muted);font-size:14px;line-height:1.8}
    main{min-width:0}
    .card{padding:18px;margin-bottom:16px}
    .hero{background:linear-gradient(135deg,#0f4f43,#163f5c);color:white}
    .hero .muted,.hero .mini{color:#d7ebe5}
    h2{margin:0;font-size:25px}
    h3{margin:0 0 12px;font-size:18px}
    .muted{color:var(--muted);line-height:1.55}
    .mini{font-size:13px;color:var(--muted)}
    .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
    select,input,textarea,button{font-family:inherit}
    select,input,textarea{border:1px solid var(--line);border-radius:13px;padding:11px 12px;background:#fff;font-size:14px}
    textarea{width:100%;min-height:100px;resize:vertical}
    button{border:0;border-radius:13px;padding:10px 12px;background:#f0eee8;color:var(--ink);cursor:pointer;font-size:14px}
    button.primary{background:var(--green);color:white;font-weight:800}
    button.warn{background:var(--yellow);color:#92400e}
    .pill{display:inline-block;background:var(--green2);color:var(--green);padding:7px 10px;border-radius:999px;font-size:13px;font-weight:900;margin-bottom:8px}
    .progress{height:10px;background:#ece7dc;border-radius:99px;overflow:hidden;margin-top:14px}
    .bar{height:100%;background:#4fb28f;width:1%}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:12px}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .item,.sentence{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fffdfa;margin-bottom:10px}
    .word{font-size:20px;font-weight:900}
    .cn{color:var(--orange);font-weight:800;margin:8px 0}
    .example{line-height:1.55;color:#374151}
    .note{color:var(--muted);font-size:13px;line-height:1.5;margin-top:8px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
    .drive{background:#10231e;color:white;border-radius:24px;padding:22px;text-align:center}
    .drive .muted{color:#cfe5dc}
    .driveBtn{font-size:20px;border-radius:999px;background:white;color:#10231e;font-weight:900;padding:14px 22px;margin:8px}
    .bigicon{font-size:42px;margin-bottom:8px}
    .hidden{display:none}
    .answerBox{background:#eef7f3;border:1px solid #cfe9df;border-radius:14px;padding:13px;margin-top:10px;line-height:1.6}
    .dashboard{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .metric{background:#fffdfa;border:1px solid var(--line);border-radius:16px;padding:14px}
    .metric b{font-size:22px}
    .levelbar{height:8px;background:#eee9df;border-radius:99px;overflow:hidden;margin-top:8px}
    .levelbar span{display:block;height:100%;background:var(--green)}
    .searchbar{width:100%;margin-bottom:12px}
    .empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
    @media(max-width:860px){
      .app{grid-template-columns:1fr;padding:0 12px 30px}
      aside{position:static;display:grid;grid-template-columns:1fr 1fr;gap:6px}
      .tab{margin:0;padding:11px 9px}
      .stats{grid-column:1/-1}
      .grid,.two,.dashboard{grid-template-columns:1fr}
      h1{font-size:24px}
    }
  </style>
</head>

<header>

function d(){return DAYS[Math.max(0,Math.min(179,day-1))];}
function esc(s){return String(s).replaceAll("\\","\\\\").replaceAll("'","\\'").replaceAll("\n"," ");}
function speak(text, rate=0.86){speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=rate; speechSynthesis.speak(u);}

function toggle(arr,key){const i=arr.indexOf(key); if(i>=0) arr.splice(i,1); else arr.push(key); save(); render();}

 if(!done.includes(day)) done.push(day);

 if(day<180) day += 1;

}
function selector(){return `<select onchange="day=Number(this.value);save();render()">${DAYS.map(x=>`<option value="${x.day}" ${x.day===day?'selected':''}>Day ${x.day}</option>`).join("")}</select>`;}

function similarity(a,b) {
 a=a.toLowerCase().replace(/[^a-z ]/g,"").split(/\s+/).filter(Boolean); b=b.toLowerCase().replace(/[^a-z ]/g,"").split(/\s+/).filter(Boolean);

}

}
function renderDashboard(){
 const completion=Math.round(done.length/180*100), avg=listenAttempts?Math.round(listenScore/listenAttempts):0;
 mainEl.innerHTML = top("Growth Dashboard", "看你的学习进度、听力分数和连续学习天数。") +
 `<section class="card"><div class="dashboard"><div class="metric"><b>${done.length}</b><br>Completed days<div class="levelbar"><span style="width:${completion}%"></span></div></div><div class="metric"><b>${streak}</b><br>Day streak<div class="levelbar"><span style="width:${Math.min(streak,30)/30*100}%"></span></div></div><div class="metric"><b>${avg}%</b><br>Listening avg<div class="levelbar"><span style="width:${avg}%"></span></div></div><div class="metric"><b>${fav.length}</b><br>Favorites<div class="levelbar"><span style="width:${Math.min(fav.length,50)/50*100}%"></span></div></div></div></section><section class="card"><h3>Current Focus</h3><p class="muted">你的核心路径是：先听懂会议，再练 Weekly Update，最后提高 Boss Small Talk 自然度。</p></section>`;
}
function renderStats(){
 statsEl.innerHTML=`<b>Rainie Coach</b><br>Day: ${day} / 180<br>Completed: ${done.length}<br>Streak: 🔥 ${streak}<br>Review: ${review.length}<br>Favorites: ${fav.length}`;
}
function render(){
 if(view==="today") renderToday();
 if(view==="drive") renderDrive();
 if(view==="gym") renderGym();
 if(view==="boss") renderBoss();
 if(view==="listen") renderListen();
 if(view==="vocab") renderVocab();
 if(view==="academy") renderAcademy();
 if(view==="review") renderReview();
 if(view==="fav") renderFav();
 if(view==="dashboard") renderDashboard();
 renderStats();
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");view=b.dataset.view;render();}));
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js"));
render();
</script>
</body>
</html>
