<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rainie's Retail English Lab V2</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1f6f5b" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root {
      --bg:#f6f4ef; --card:#fff; --text:#1f2933; --muted:#6b7280; --line:#e5e1d8;
      --accent:#1f6f5b; --accent2:#b45309; --soft:#e5f3ee; --yellow:#fff7df;
      --shadow:0 12px 30px rgba(31,41,51,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
    header{max-width:1180px;margin:auto;padding:22px 16px 10px}
    h1{margin:0;font-size:28px;letter-spacing:-.6px}
    .subtitle{color:var(--muted);line-height:1.6;margin-top:8px}
    .app{max-width:1180px;margin:auto;padding:0 16px 36px;display:grid;grid-template-columns:250px 1fr;gap:18px}
    .sidebar,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
    .sidebar{padding:14px;height:fit-content;position:sticky;top:14px}
    .tab{width:100%;border:0;background:transparent;padding:12px 13px;text-align:left;border-radius:12px;font-size:15px;cursor:pointer;margin-bottom:6px;color:var(--text)}
    .tab.active{background:var(--soft);color:var(--accent);font-weight:800}
    .stats{margin-top:12px;padding:13px;background:#faf9f6;border-radius:14px;color:var(--muted);font-size:14px;line-height:1.8}
    main{min-width:0}
    .card{padding:18px;margin-bottom:16px}
    .topbar{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
    h2{margin:0;font-size:24px}
    h3{margin:0 0 12px;font-size:18px}
    .desc{color:var(--muted);line-height:1.55;margin:7px 0 0}
    .pill{display:inline-block;background:var(--soft);color:var(--accent);padding:7px 10px;border-radius:999px;font-size:13px;font-weight:700}
    .progress{height:10px;background:#eee9df;border-radius:99px;overflow:hidden;margin-top:14px}
    .bar{height:100%;background:var(--accent);width:1%}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    button,input,select{font-family:inherit}
    button{border:0;border-radius:12px;padding:10px 12px;background:#f0eee8;color:var(--text);cursor:pointer;font-size:14px}
    .primary{background:var(--accent);color:#fff}
    .warn{background:var(--yellow);color:#92400e}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:12px}
    .item{border:1px solid var(--line);border-radius:15px;padding:14px;background:#fffdfa}
    .word{font-size:20px;font-weight:900;margin-bottom:5px}
    .cn{font-weight:800;color:var(--accent2);margin:8px 0}
    .example{line-height:1.55;color:#374151}
    .note{color:var(--muted);font-size:13px;line-height:1.5;margin-top:8px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
    .sentence{padding:12px 13px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:#fffdfa;line-height:1.55}
    .audioBox{background:#10231e;color:#fff;border-radius:18px;padding:18px}
    .audioBox .desc{color:#d9ebe4}
    .bigplay{font-size:18px;padding:13px 18px;border-radius:999px;background:#fff;color:#10231e;font-weight:900;margin-top:14px}
    .drive{font-size:32px;margin-bottom:6px}
    .mini{font-size:13px;color:var(--muted)}
    .empty{padding:34px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted)}
    .selectDay{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:120px}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .install{background:#eef7f3;color:#1f6f5b;border:1px solid #cfe9df;border-radius:14px;padding:12px 14px;line-height:1.55;font-size:14px}
    @media(max-width:850px){
      .app{grid-template-columns:1fr;padding:0 12px 30px}
      .sidebar{position:static;display:grid;grid-template-columns:1fr 1fr;gap:6px}
      .tab{margin:0;padding:11px 9px}
      .stats{grid-column:1/-1}
      .grid,.two{grid-template-columns:1fr}
      h1{font-size:24px}
    }
  </style>
</head>
<body>
<header>
  <h1>Rainie's Retail English Lab V2</h1>
  <div class="subtitle">60天 · 每天30分钟 · 为 Strategy One / Retail Design / 外国老板会议 / Small Talk 定制。</div>
</header>
<div class="app">
  <aside class="sidebar">
    <button class="tab active" data-view="daily">Today</button>

    <button class="tab" data-view="meeting">Meeting</button>
    <button class="tab" data-view="presentation">Presentation</button>
    <button class="tab" data-view="smalltalk">Small Talk</button>
    <button class="tab" data-view="audio">Drive Audio</button>
    <button class="tab" data-view="review">Review</button>
    <button class="tab" data-view="favorite">Favorites</button>
    <div class="stats" id="stats"></div>
  </aside>
  <main id="main"></main>
</div>

let currentView = "daily";
let savedDay = Number(localStorage.getItem("rainieDay") || "1");
let review = JSON.parse(localStorage.getItem("rainieReviewV2") || "[]");
let favorite = JSON.parse(localStorage.getItem("rainieFavV2") || "[]");
let completed = JSON.parse(localStorage.getItem("rainieCompletedV2") || "[]");

function dayData() { return DAYS[Math.max(0, Math.min(59, savedDay-1))]; }
function save() {
  localStorage.setItem("rainieDay", savedDay);
  localStorage.setItem("rainieReviewV2", JSON.stringify(review));
  localStorage.setItem("rainieFavV2", JSON.stringify(favorite));
  localStorage.setItem("rainieCompletedV2", JSON.stringify(completed));
}
function speak(text, slow=false) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = slow ? 0.72 : 0.86; u.pitch = 1;
  speechSynthesis.speak(u);
}
function stopSpeak() { speechSynthesis.cancel(); }
function toggleReview(key) {
  review = review.includes(key) ? review.filter(x=>x!==key) : [...review,key]; save(); render();
}
function toggleFav(key) {
  favorite = favorite.includes(key) ? favorite.filter(x=>x!==key) : [...favorite,key]; save(); render();
}
function completeToday() {
  if(!completed.includes(savedDay)) completed.push(savedDay);
  if(savedDay < 60) savedDay++;
  save(); render();
}
function daySelector() {
  return `<select class="selectDay" onchange="savedDay=Number(this.value);save();render()">
    ${DAYS.map(d=>`<option value="${d.day}" ${d.day===savedDay?'selected':''}>Day ${d.day}</option>`).join("")}
  </select>`;
}
function topCard(title, desc) {
  const d=dayData(), pct=Math.round((savedDay/60)*100);
  return `<section class="card">
    <div class="topbar">
      <div><span class="pill">${d.theme}</span><h2>${title}</h2><p class="desc">${desc}</p></div>
      <div>${daySelector()}</div>
    </div>
    <div class="progress"><div class="bar" style="width:${pct}%"></div></div>
    <p class="mini">Day ${savedDay} / 60 · Today's goal: ${d.goal}</p>
  </section>`;
}
function vocabCards(items) {
  return `<div class="grid">${items.map(v=>`
    <div class="item">
      <div class="word">${v.word}</div>
      <button onclick="speak('${esc(v.word)}')">🔊 word</button>
      <div class="cn">${v.cn}</div>
      <div class="example">${v.example}</div>
      <div class="note">${v.note}</div>
      <div class="actions">
        <button class="warn" onclick="toggleReview('${esc(v.word)}')">${review.includes(v.word)?"移出复习":"不会，复习"}</button>
        <button onclick="toggleFav('${esc(v.word)}')">${favorite.includes(v.word)?"★ 已收藏":"☆ 收藏"}</button>
        <button onclick="speak('${esc(v.example)}', true)">慢速例句</button>
      </div>
    </div>`).join("")}</div>`;
}
function sentenceList(list) {
  return list.map(s=>`<div class="sentence">${s}<div class="actions"><button onclick="speak('${esc(s)}')">🔊</button><button onclick="speak('${esc(s)}',true)">慢速</button><button onclick="toggleFav('${esc(s)}')">${favorite.includes(s)?"★ 已收藏":"☆ 收藏"}</button></div></div>`).join("");
}
function renderDaily() {
  const d=dayData();
  main.innerHTML = topCard("Today Learning", "每天30分钟：单词、会议、汇报、Small Talk、开车听力、复习。") +
  `<section class="card install">手机安装：Safari/Chrome 打开网站 → 分享/菜单 → 添加到主屏幕。</section>
   <section class="card"><h3>1. Vocabulary · 5 min</h3>${vocabCards(d.vocabulary)}</section>
   <section class="card"><h3>2. Meeting English · 5 min</h3>${sentenceList(d.meeting)}</section>
   <section class="card"><h3>3. Presentation Practice · 5 min</h3>${sentenceList([d.presentation])}</section>
   <section class="card"><h3>4. Small Talk · 5 min</h3><div class="sentence"><b>${d.smalltalk.topic}</b><br>${d.smalltalk.question}<br><span class="mini">${d.smalltalk.answer}</span><div class="actions"><button onclick="speak('${esc(d.smalltalk.question+' '+d.smalltalk.answer)}')">🔊</button><button onclick="toggleFav('${esc(d.smalltalk.question)}')">☆ 收藏</button></div></div></section>
   <section class="card audioBox"><div class="drive">🚗</div><h3>5. Daily Drive Audio · 5-8 min</h3><p class="desc">开车回家时点播放，不需要看屏幕。</p><button class="bigplay" onclick="speak('${esc(d.audioScript)}')">▶ Play Today's Audio</button> <button onclick="stopSpeak()">Stop</button></section>
   <section class="card"><h3>6. Finish</h3><button class="primary" onclick="completeToday()">完成今天，进入下一天</button></section>`;
}

function renderFav() {
 const allVoc = DAYS.flatMap(d=>d.vocabulary).filter(v=>favorite.includes(v.word));
 const allSent = DAYS.flatMap(d=>[...d.meeting,d.presentation,d.smalltalk.question]).filter(s=>favorite.includes(s));
 main.innerHTML = topCard("Favorites", "开会前快速复习你收藏的表达。") + `<section class="card"><h3>Favorite Words</h3>${allVoc.length?vocabCards(allVoc):'<div class="empty">还没有收藏单词。</div>'}</section><section class="card"><h3>Favorite Sentences</h3>${allSent.length?sentenceList(allSent):'<div class="empty">还没有收藏句子。</div>'}</section>`;
}
function esc(s) { return String(s).replaceAll("\\","\\\\").replaceAll("'","\\'").replaceAll("\n"," "); }
function renderStats() {
 stats.innerHTML = `<b>Progress</b><br>Day: ${savedDay} / 60<br>Completed: ${completed.length} days<br>Review: ${review.length}<br>Favorites: ${favorite.length}`;
}
function render() {
 if(currentView==="daily") renderDaily();
 if(currentView==="vocab") renderVocab();
 if(currentView==="meeting") renderMeeting();
 if(currentView==="presentation") renderPresentation();
 if(currentView==="smalltalk") renderSmalltalk();
 if(currentView==="audio") renderAudio();
 if(currentView==="review") renderReview();
 if(currentView==="favorite") renderFav();
 renderStats();
}
document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));btn.classList.add("active");currentView=btn.dataset.view;render();}));
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js"));
render();
</script>
</body>
</html>
